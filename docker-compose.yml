services:
  app:
    container_name: veterinary-back-app
    image: ricmtech/veterinary-back-app
    restart: always
    build:
      context: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - veterinary-back
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}

  db:
    container_name: ${DB_NAME}
    image: postgres:14.3
    restart: always
    ports:
      - "5432:5432"
    networks:
      - veterinary-back
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data

networks:
  veterinary-back:
    driver: bridge
